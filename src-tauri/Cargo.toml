[package]
name    = "luminawall"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "luminawall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs     = { version = "2" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default         = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
